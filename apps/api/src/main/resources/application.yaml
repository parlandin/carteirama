spring:
  application:
    name: carteirama

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true

  session:
    timeout: 12h

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
        path: /

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger
    csrf:
      enabled: true

logging:
  pattern:
    correlation: "[%X{request_id:-}] "

carteirama:
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  trial-days: 7
  suspend-after-days: 5
  retention-days: 90
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  csrf:
    cookie-domain: ${CSRF_COOKIE_DOMAIN:}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:Carteirama <onboarding@resend.dev>}
  payment:
    provider: ${PAYMENT_PROVIDER:none}
    abacatepay:
      api-key: ${ABACATEPAY_API_KEY:}
      webhook-secret: ${ABACATEPAY_WEBHOOK_SECRET:}
      pix-expires-in: 1h
      invoice-days-before: 5
