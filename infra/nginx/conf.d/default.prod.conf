server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API Spring Boot
    location /api/ {
        # Sem barra no fim do proxy_pass: o caminho chega inteiro (/api/v1/...), sem cortar o /api
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        # $http_host mantém a porta (localhost:8080); a API usa isso para montar URLs absolutas
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets do Vite têm hash no nome, então podem ficar em cache por 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
