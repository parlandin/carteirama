# Prod: o container web (Nginx) serve o build estático do React e faz o proxy da API.
# É o único serviço com porta exposta.
services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  db:
    restart: unless-stopped
